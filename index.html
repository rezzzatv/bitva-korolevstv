<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Битва королевств</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6ecd4;--tx:#2b1b0e;--card:#fffaf0;--ac:#8a4b12;--ln:#c9a96a;--water:#4b86c4}
@media (prefers-color-scheme:dark){:root{--bg:#1d140b;--tx:#f7e8cc;--card:#33251a;--ac:#e8b46a;--ln:#6b4f2b;--water:#2d5a8c}}
:root[data-theme=dark]{--bg:#1d140b;--tx:#f7e8cc;--card:#33251a;--ac:#e8b46a;--ln:#6b4f2b;--water:#2d5a8c;color-scheme:dark}
:root[data-theme=light]{--bg:#f6ecd4;--tx:#2b1b0e;--card:#fffaf0;--ac:#8a4b12;--ln:#c9a96a;--water:#4b86c4;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--tx)}
#app{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:10px;max-width:1500px;margin:auto}
@media (max-width:820px){#app{grid-template-columns:1fr}}
#map{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));grid-template-rows:repeat(15,minmax(0,1fr));width:100%;max-width:min(100%,88vh);aspect-ratio:1;border:5px solid var(--ac);border-radius:10px;margin:auto;background:var(--ln)}
.c{position:relative;border:1px solid #0002;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,2vw,20px);min-width:0;min-height:0}
.c.w{background:var(--water)}.c.k{filter:brightness(.8)}
.c.ok{cursor:pointer;box-shadow:inset 0 0 0 2px #3ca55c}
.c.ok::after{content:"";position:absolute;inset:0;border:3px solid #3ca55c;z-index:7;pointer-events:none;box-sizing:border-box}
.c img{position:absolute;left:0;top:0;height:100%;z-index:2;max-width:none;filter:drop-shadow(0 2px 2px #0008)}
#side{background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:12px;font-size:14px;max-height:96vh;overflow:auto}
#side h3{margin:12px 0 6px;color:var(--ac);font-size:15px}
#side h3:first-child{margin-top:0}
.t{font-size:26px;font-weight:bold;color:var(--ac)}
button{font:inherit;padding:6px 12px;border-radius:999px;border:2px solid var(--ac);background:var(--card);color:var(--tx);cursor:pointer}
button.on{background:var(--ac);color:var(--card)}
.ch{display:inline-block;width:44px;height:44px;margin:2px;border-radius:6px;border:2px solid #0004;cursor:pointer;vertical-align:middle;position:relative}
.ch img{width:100%;height:100%;border-radius:4px}
.ch b{position:absolute;right:0;bottom:0;background:var(--ac);color:var(--card);border-radius:6px;padding:0 4px;font-size:11px}
.arm{border:1px solid var(--ln);border-radius:8px;padding:4px;margin:4px 0;min-height:56px;cursor:pointer}
.arm.on{border:2px solid #f5c518}
#log{font-size:13px;max-height:120px;overflow:auto;opacity:.9}
</style></head><body>
<div id="app"><div id="map"></div><div id="side"></div></div>

const COLS={green:'#3d9a52',blue:'#2f6fd6',milk:'#efe3c4',red:'#c8322f'};
const NM={LI:'Лёгкая пехота',HI:'Тяжёлая пехота',LC:'Лёгкая конница',HC:'Тяжёлая конница',king:'Король',queen:'Королева',general:'Генерал',captain:'Капитан',dagger:'Кинжал'};
const SEAT=[[1,7,1,8,1,1],[8,15,1,7,15,1],[9,15,8,15,15,15],[1,8,9,15,1,15]];
const PORT=[[6,6],[10,6],[10,10],[6,10]],ME=3;
const lake=(x,y)=>x>=6&&x<=10&&y>=6&&y<=10;
const seatOf=(x,y)=>SEAT.findIndex(s=>x>=s[0]&&x<=s[1]&&y>=s[2]&&y<=s[3]);
const castle=(x,y)=>SEAT.some(s=>Math.abs(x-s[4])+Math.abs(y-s[5])<=2);
const cellsOf=b=>b.t==='b'?[[b.x,b.y],b.v?[b.x,b.y+1]:[b.x+1,b.y]]:[[b.x,b.y]];
let POS,vert=false,B,phase,left,tool,selA,pool,army,colorOf,logs,first,timer,myCol='green';
const $=id=>document.getElementById(id),map=$('map'),side=$('side');
const log=t=>{logs.unshift(t);if(logs.length>80)logs.pop()};
function castleCells(s){const r=[];for(let y=1;y<=15;y++)for(let x=1;x<=15;x++)if(seatOf(x,y)===s&&castle(x,y))r.push([x,y]);return r}
function mkArmy(s,k){const i=document.createElement('img');i.src=SPR[colorOf[s]][k];i.style.zIndex=3;i.style.width='100%';i.title=NM[k];return i}
function okAt(x,y,seat,t,v){
  const cs=cellsOf({t,x,y,v});
  const wet=cs.filter(([a,b])=>lake(a,b));
  if(t==='e'?wet.length>0:(wet.length>=cs.length||wet.some(([a,b])=>PORT.some(p=>p[0]===a&&p[1]===b))))return false;
  return cs.every(([a,b])=>a>=1&&a<=15&&seatOf(a,b)===seat&&!castle(a,b)&&![-1,0,1].some(i=>[-1,0,1].some(j=>castle(a+i,b+j)))&&
    !B.some(o=>o.seat===seat&&cellsOf(o).some(([p,q])=>Math.abs(p-a)<=1&&Math.abs(q-b)<=1)));
}
const cnt=(seat,t)=>B.filter(b=>b.seat===seat&&b.t===t).length;
const need=t=>(t==='e'?4:2)-cnt(ME,t);
function botPlace(seat){
  for(const t of['e','e','e','e','b','b'])for(let i=0;i<500;i++){
    const x=1+Math.floor(Math.random()*15),y=1+Math.floor(Math.random()*15);
    const v=t==='b'&&Math.random()<.5;if(okAt(x,y,seat,t,v)){B.push({seat,t,x,y,v});break}
  }
}
var NB=3;try{const v=localStorage.getItem('bk_nb');if(v!==null&&+v>=1&&+v<=3)NB=+v}catch(e){}
const actSeats=()=>NB===1?[1,3]:NB===2?[0,2,3]:[0,1,2,3];

function setNb(n){NB=n;try{localStorage.setItem('bk_nb',n)}catch(e){}if(phase==='setup')start();else draw()}
function setDiff(n){DIFF=n;try{localStorage.setItem('bk_diff',n)}catch(e){}draw()}
function diffHtml(){
  const N=['Лёгкий','Нормальный','Сложный'],T=['Как раньше: ходят почти наугад, в бою не прикрывают армии.','Взвешивают риск, прикрывают армии, в бою просчитывают ответные ходы.','Считают угрозы по всей карте, защищают флаг, в бою просчитывают на несколько ходов вперёд.'];
  return '<h3>Боты</h3><div style="margin-bottom:4px">Количество: '+[1,2,3].map(n=>`<button class="${NB===n?'on':''}" onclick="setNb(${n})">${n}</button>`).join(' ')+(phase!=='setup'?' <span style="opacity:.7;font-size:11px">со следующей партии</span>':'')+'</div><div>'+N.map((n,i)=>`<button class="${DIFF===i?'on':''}" onclick="setDiff(${i})">${n}</button>`).join(' ')+'</div><div style="opacity:.7;font-size:11px;margin-top:3px">'+T[DIFF]+'</div>';
}
function start(){
  const o=Object.keys(COLS).filter(c=>c!==myCol);
  colorOf=[o[0],o[1],o[2],myCol];
  B=[];phase='setup';left=120;tool='e';selA='queen';logs=[];
  pool={LI:8,HI:6,LC:4,HC:2,dagger:1};army={king:[],queen:[],general:[],captain:[]};
  for(const s of actSeats())if(s!==ME)botPlace(s);
  POS=[{},{},{},{}];for(const s of actSeats())if(s!==ME){const cs=castleCells(s).sort(()=>Math.random()-.5);['king','queen','general'].forEach((k,i)=>POS[s][k]=cs[i])}
  log('Расставьте 4 поместья и 2 бастиона на своей земле (слева внизу). Остальные игроки ничего не видят.');
  clearInterval(timer);timer=setInterval(()=>{if(!(typeof TUT!=='undefined'&&TUT)&&--left<=0)reveal();draw()},1000);
  draw();
}
function reveal(){
  if(phase!=='setup')return;
  for(const k of['king','queen','general'])if(!POS[ME][k]){POS[ME][k]=castleCells(ME).find(q=>!Object.values(POS[ME]).some(p=>p&&p[0]===q[0]&&p[1]===q[1]))}
  clearInterval(timer);phase='play';
  first=Math.floor(Math.random()*4);
  log('Время вышло: все постройки открыты. Первый ход у '+(first===ME?'вас':'игрока '+(first+1))+'.');
  draw();
}
function drawMap(){

function retreat(ar,from,len){

      const k=seatOf(x,y);
      if(k>=0&&castle(x,y)&&G.co[k]!==ar.owner&&G.co[k]!==null)break;

/* ===== МЕХАНИКА v2: фаза ходов ===== */

function beginTurn(p){

  for(const b of G.bas)if(b.occ===p){
    const hold=b.gar===p||G.ar.some(a=>a.owner===p&&!a.aboard&&b.cells.some(c=>same(c,a.pos)))||b.cells.some(c=>{const o=G.orph[key(c[0],c[1])];return o&&o.owner===p&&o.units.length>0}),ow=G.co[b.seat];

    const hold=G.ar.some(a=>a.owner===p&&a.kind==='captain'&&same(a.pos,PORT[i])),ow=G.co[i];
    if(hold&&ow!==null&&ow!==p&&alive(ow))pay(ow,1,p);else G.pocc[i]=null;

}

/* ---- объявления ---- */

}

/* ---- боты: общий код ---- */
function botGoals(p){

const cheb=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));

/* ===== МЕХАНИКА v2: фаза сражений ===== */

/* ---- создание боя ---- */
function mkPart(ar,isDef,i){
  const q={ar,owner:ar.owner,idx:i,isDef,corner:-1,pieces:[],disAt:null,cmdDead:false,cmdFled:false,tentLost:false,killer:null,castle:isDef&&onFlag(ar)};

    for(const c of G.ar)if(c.aboard===ar.id)c.units.forEach(k=>us.push({k,src:c}));
    us=us.slice(0,5);
  }else us=ar.units.slice(0,ar.dagger?4:5).map(k=>({k,src:ar}));
  us.forEach(u=>q.pieces.push({k:u.k,cmd:false,pi:i,owner:ar.owner,x:null,y:null,alive:true,fled:false,src:u.src,col}));

/* ---- ходы в бою ---- */
function pm(p){

function battleOver(){
  const ab=BT.parts.filter(q=>!isDis(q)),ow=[...new Set(ab.map(q=>q.owner))];
  if(BT.n>=320){BT.draw=true;return true}
  if(ow.length>=2&&BT.n-BT.lastCap>=60){BT.draw=true;log('Долго никто никого не бьёт: ничья.');return true}
  if(ab.length===0)return true;
  if(ow.length===1){
    if(BT.endAt===null)BT.endAt=BT.n;
    const rest=BT.P.some(p=>p.alive&&p.k!=='tent'&&isDis(BT.parts[p.pi])&&p.owner!==ow[0]);
    if(!rest||BT.n>BT.endAt+80)return true;
  }

}
function turnLoop(){
  if(!BT||BT.stage!=='fight')return;
  if(battleOver())return endBoard();
  let k=0;
  while(k<BT.parts.length&&!hasAct(BT.parts[BT.cur])){BT.cur=(BT.cur+1)%BT.parts.length;k++}
  if(k>=BT.parts.length){BT.draw=true;return endBoard()}
  const q=BT.parts[BT.cur];
  if(isHum(q.owner)){draw();return}
  if(BT.hum){const b=BT;setTimeout(()=>{if(b===BT)botMove(q)},450)}
  else botMove(q);
}
function botMoveEasy(q){
  const mine=q.pieces.filter(p=>p.alive&&p.k!=='tent');
  let best=null,bs=-1e9;
  if(isDis(q)){
    for(const p of mine){
      if(canExit(p)){const s=1000+Math.random();if(s>bs){bs=s;best=['x',p]}continue}
      const d0=edgeDist(p);
      for(const[x,y]of pm(p)){const s=(d0-edgeDist({x,y}))*10+Math.random();if(s>bs){bs=s;best=['m',p,x,y]}}
    }
  }else{
    const able=BT.parts.filter(z=>z!==q&&z.owner!==q.owner&&!isDis(z));
    const tg=BT.P.filter(e=>e.alive&&e.owner!==q.owner&&(e.tent||e.cmd)&&!isDis(BT.parts[e.pi]));
    const fl=BT.P.filter(e=>e.alive&&e.owner!==q.owner&&e.k!=='tent'&&isDis(BT.parts[e.pi]));
    const aim=tg.length?tg:fl;
    for(const p of mine)for(const[x,y]of pm(p)){
      const o=bat(x,y);let s=Math.random();
      if(o)s+=(o.tent||o.cmd)?10000:(isDis(BT.parts[o.pi])?400:60);
      const ox=p.x,oy=p.y;if(o)o.alive=false;p.x=x;p.y=y;
      const cm=q.pieces.find(z=>z.cmd&&z.alive),tn=q.pieces.find(z=>z.tent&&z.alive);
      if(cm&&batk(cm.x,cm.y,q.owner))s-=3000;
      if(tn&&batk(tn.x,tn.y,q.owner))s-=3000;
      if(batk(x,y,q.owner)&&!(o&&(o.tent||o.cmd)))s-=p.cmd?3000:40;
      if(!p.cmd&&aim.length)s-=2*Math.min(...aim.map(e=>Math.abs(e.x-x)+Math.abs(e.y-y)));
      p.x=ox;p.y=oy;if(o)o.alive=true;
      if(s>bs){bs=s;best=['m',p,x,y]}
    }
    if(!best)for(const p of mine)if(canExit(p)){best=['x',p];break}
  }
  if(!best){BT.cur=(BT.cur+1)%BT.parts.length;BT.n++;return turnLoop()}
  bstep(best[0],best[1],best[2],best[3]);
}
/* ---- итоги боя ---- */
function endBoard(){
  const b=BT,parts=b.parts,D=parts.filter(q=>q.isDef)[0],A0=parts[0];
  const ab=parts.filter(q=>!isDis(q)),abOw=[...new Set(ab.map(q=>q.owner))],winner=b.draw||abOw.length!==1?null:ab[0];
  const dis_=o=>parts.filter(q=>q.owner===o).every(isDis),disT=o=>Math.min(...parts.filter(q=>q.owner===o).map(q=>q.disAt===null?1e9:q.disAt));
  // потери юнитов
  for(const q of parts)for(const p of q.pieces)if(!p.cmd&&!p.tent&&!p.alive&&!p.fled){
    const i=p.src.units.indexOf(p.k);if(i>=0)p.src.units.splice(i,1);
    G.pl[p.src.owner].dead.push({t:'unit',k:p.k});
  }
  // выплаты
  if(!b.draw){
    const Dd=dis_(D.owner),Ad=dis_(A0.owner);
    if(Dd&&Ad){
      const first=disT(D.owner)<=disT(A0.owner)?[D,A0]:[A0,D];
      log('Оба проиграли: платит тот, кто выбыл первым.');pay(first[0].owner,3,first[1].owner);
    }else if(Dd)pay(D.owner,3,A0.owner);
    else if(parts.filter(q=>!q.isDef).every(q=>dis_(q.owner))){
      for(const o of[...new Set(parts.filter(q=>!q.isDef).map(q=>q.owner))])pay(o,3,D.owner);
    }
  }
  if(winner)log((winner.owner===ME?'Вы победили':'Победил игрок '+(winner.owner+1))+' в бою.');
  else log(b.draw?'Бой закончился ничьёй.':'Бой закончился без победителя.');
  // судьба армий
  for(const q of parts){
    const ar=q.ar;if(!G.ar.includes(ar))continue;
    if(q.cmdDead){removeCmd(ar,q.killer);continue}
    if(q.castle&&q.isDef&&isDis(q)){ar.units.forEach(u=>G.pl[ar.owner].dead.push({t:'unit',k:u}));ar.units=[]}
  }
  if(b.draw){
    for(const q of parts){
      if(!G.ar.includes(q.ar)||(q.castle&&q.isDef))continue;
      const ref=q.isDef?A0.ar.pos:D.ar.pos;retreat(q.ar,ref,2);
    }
  }else for(const q of parts){
    if(!isDis(q)||!G.ar.includes(q.ar)||q.cmdDead)continue;
    if(q.isDef&&q.castle)continue;
    const ref=q.isDef?A0.ar.pos:(winner?winner.ar.pos:D.ar.pos);
    retreat(q.ar,ref,q.ar.kind==='captain'?3:4);
  }
  G.note=logs.slice(0,2).reverse().join(' ');
  BT=null;G.pend=null;draw();
  if(!G.over)setTimeout(nextBattle,1800);
}

function bclick(x,y){

function whyNot(a,x,y){
  if(a.aboard)return 'Армия на корабле: высадиться можно на соседнюю с кораблём клетку суши, и не в ход посадки.';
  if(a.def)return 'На эту армию объявлено нападение: она стоит на месте до боя.';
  if(a.atkd)return 'Эта армия уже напала в этот ход: после нападения ходить нельзя.';
  if(a.moved)return 'Эта армия уже ходила в этот ход.';
  if(a.noMove===G.tn)return 'Восстановленный полководец ходит только со следующего хода.';
  const dx=x-a.pos[0],dy=y-a.pos[1],d=Math.max(Math.abs(dx),Math.abs(dy));
  if(!d)return '';
  if(dx&&dy&&Math.abs(dx)!==Math.abs(dy))return 'Армия ходит по прямой или по диагонали, в одном направлении, без поворота.';
  const r=rng(a),sx=Math.sign(dx),sy=Math.sign(dy);
  for(let t=1;t<=Math.min(d,r);t++){
    const cx=a.pos[0]+sx*t,cy=a.pos[1]+sy*t,bs=bastAt(cx,cy),k=seatOf(cx,cy);
    if(!inMap(cx,cy))return 'Это край карты.';
    if(a.kind==='captain'){if(!lake(cx,cy))return 'Капитан ходит только по воде.'}
    else if(lake(cx,cy)&&!bs)return 'Клетка '+cx+','+cy+' — вода: сухопутная армия в воду не заходит, кроме клеток бастиона. Перепрыгивать нельзя.';
    if(bs&&bs.gar!==null&&bs.gar!==a.owner)return 'В этом бастионе стоит гарнизон соперника: обе клетки бастиона закрыты для чужих армий. На него нельзя ни нападать, ни заходить.';
    const e=G.est[key(cx,cy)];if(e&&e.burned)return 'Сгоревшее поместье — препятствие.';
    const o=G.orph[key(cx,cy)];
    if(o&&o.owner!==a.owner&&!isFlag(cx,cy))return 'Здесь стоят неподвижные юниты соперника без полководца: это препятствие.';
    const bl=armiesAt(cx,cy);
    if(bl.some(z=>z.owner!==a.owner))return t===d?'Клетку занимает армия соперника. Чтобы напасть, встаньте рядом по стороне и нажмите «Напасть».':'На пути стоит армия соперника: перепрыгивать нельзя.';
    if(bl.length&&!(k>=0&&castle(cx,cy)&&G.co[k]===a.owner))return 'Проходить через свою армию или ставить две армии на одну клетку вне замка нельзя.';
    if(t<d&&a.kind!=='captain'&&k>=0&&castle(cx,cy)&&G.co[k]!==a.owner&&G.co[k]!==null)return 'В чужой замок заходят по одной клетке за ход: дальше идти нельзя.';
    if(t<d&&o&&o.owner===a.owner)return 'Здесь лежат ваши юниты: армия останавливается, чтобы их забрать.';
  }
  if(d>r)return 'Слишком далеко: отсюда армия ходит не дальше '+r+' '+(r===1?'клетки':'клеток')+' (на своей и нейтральной земле до 3, на чужой до 2, в чужом замке 1; капитан по воде до 2).';
  return 'Сюда ходить нельзя.';
}

/* ===== УРОВНИ БОТОВ: 0 лёгкий, 1 нормальный, 2 сложный ===== */
var BOTLV=null,MAPLV=null,BATLV=null;
const lvOf=p=>(BOTLV&&BOTLV[p]!==undefined)?BOTLV[p]:DIFF;
const lvMap=p=>(MAPLV&&MAPLV[p]!==undefined)?MAPLV[p]:lvOf(p);
const lvBat=p=>(BATLV&&BATLV[p]!==undefined)?BATLV[p]:lvOf(p);
function botTurn(p){return lvMap(p)===0?botTurnEasy(p):botTurnSmart(p,lvMap(p))}
function botMove(q){return lvBat(q.owner)===0?botMoveEasy(q):botMoveSmart(q,lvBat(q.owner))}
function bPlace(q){return lvBat(q.owner)===0?bPlaceEasy(q):bPlaceSmart(q)}
function buyDecide(t,pw){
  const L=lvOf(t.owner),ratio=power(t)/Math.max(1,pw);
  if(L===0)return Math.random()<(ratio<.9?.7:.12);
  if(L===1)return ratio<.95&&Math.random()<.9;
  return ratio<1.05&&G.pl[t.owner].coins>=2;
}

/* ---------- ходы по карте ---------- */
function enemyReach(e){
  const sv=[e.moved,e.def,e.noMove];e.moved=false;e.def=false;e.noMove=-1;
  const r=reach(e);e.moved=sv[0];e.def=sv[1];e.noMove=sv[2];return r;
}
function threatMap(p){
  const T=new Map();
  for(const e of G.ar){
    if(e.owner===p||!alive(e.owner)||e.aboard)continue;
    const pw=power(e),seen=new Set();
    for(const c of[e.pos,...enemyReach(e)])for(const d of DIRS8.slice(0,4)){
      const k=key(c[0]+d[0],c[1]+d[1]);
      if(!seen.has(k)){seen.add(k);T.set(k,(T.get(k)||0)+pw)}
    }
  }
  return T;
}
function goalsW(p,L,cap){
  const r=[];
  if(cap){for(let i=0;i<4;i++)if(G.co[i]!==p&&G.co[i]!==null&&G.pocc[i]===null)r.push([PORT[i],3]);return r}
  for(const k in G.est){const e=G.est[k];if(!e.burned&&G.co[e.seat]!==null&&G.co[e.seat]!==p&&alive(G.co[e.seat]))r.push([k.split(',').map(Number),1.5+e.val*(L===2?1.2:.8)])}
  for(const b of G.bas)if(b.occ===null&&bastHold(b)===null&&G.co[b.seat]!==null&&G.co[b.seat]!==p&&alive(G.co[b.seat]))r.push([b.cells[0],3]);
  for(let i=0;i<4;i++)if(G.orig[i]!==p&&alive(G.orig[i])){
    // флаг слабого игрока — самая ценная цель (его выбывание)
    const w=(L===2?10:7)+(L===2&&G.orig[i]===ME?3:0);
    r.push([FLAGP[i],w]);
  }
  return r;
}
function goalsHome(p,L,a){
  const r=[];
  // вторженцы на моей земле
  for(const e of G.ar){
    if(e.owner===p||!alive(e.owner)||e.aboard||e.kind==='captain')continue;
    const k=terr(e.pos);
    if(k>=0&&G.co[k]===p&&power(a)+1>=power(e))r.push([e.pos,7]);
  }
  // свои бастионы без гарнизона и поместья без охраны
  if(a.units.length>=3){
    for(const b of G.bas)if(G.co[b.seat]===p&&bastHold(b)===null)r.push([b.cells[0],2.5]);
    if(L===2)for(const k in G.est){const e=G.est[k];if(!e.burned&&G.co[e.seat]===p&&!G.orph[k])r.push([k.split(',').map(Number),2]);}
  }

}
function supportAt(p,a,c){
  let s=0;
  for(const b of G.ar)if(b.owner===p&&b!==a&&!b.aboard&&b.kind!=='captain'&&adjS(b.pos,c))s+=power(b);
  return s;
}
function smartBestCell(a,p,L,T,gs,defender){
  const mine=power(a),cap=a.kind==='captain';
  const cand=[...reach(a)];
  cand.push(a.pos.slice());
  let best=null,bs=-1e9;
  for(const c of cand){
    const stay=same(c,a.pos);
    let s=0;
    // продвижение к цели: чем ближе и ценнее, тем лучше
    let gv=-1e9;for(const[g,w]of gs){const v=w*4-3*cheb(g,c);if(v>gv)gv=v}
    if(gv>-1e9)s+=gv;
    // добыча: сжечь чужое поместье, занять чужой бастион
    if(!cap){

      if(e&&!e.burned&&G.co[e.seat]!==null&&G.co[e.seat]!==p&&alive(G.co[e.seat]))s+=14+5*e.val;
      const b=bastAt(c[0],c[1]);

    }

    if(defender)s+=same(c,FLAGP[p])?80:-2*cheb(c,FLAGP[p]);
    // опасность
    const th=T.get(key(c[0],c[1]))||0;
    const castleSafe=!cap&&castle(c[0],c[1])&&G.co[seatOf(c[0],c[1])]===p;
    const sup=supportAt(p,a,c);
    if(!castleSafe){
      const deficit=.6*th-(mine+sup)-(L===2?0:1);
      if(deficit>0)s-=(L===2?1.5:1)*deficit;
    }
    // возможности нападения
    for(const t of G.ar){
      if(t.owner===p||!alive(t.owner)||t.aboard||!adjS(t.pos,c))continue;
      const def=power(t)+(G.ar.some(z=>z!==t&&z.owner===t.owner&&!z.aboard&&adjS(z.pos,t.pos))?1:0);
      const me=mine+sup;

    }

    if(stay&&!defender){s-=(inCastle(a)||ownPort(a))?4:6}
    s+=Math.random()*(L===2?.3:1.5);
    if(s>bs){bs=s;best=c}
  }

}
function smartAttack(a,p,L){
  if(!G.ar.includes(a)||a.atkd||a.def||a.aboard)return;
  const tg=G.ar.filter(t=>canAttack(a,t));
  if(!tg.length)return;

    const dg=tg.filter(t=>canDagger(a,t));
    const val=t=>power(t)+(inCastle(t)?4:0)+(t.dagger?2:0)+(t.owner===ME&&L===2?1:0);
    dg.sort((x,y)=>val(y)-val(x));

  }

  for(const t of tg){
    const j=G.decl.find(d=>d.def===t.id);
    let me=power(a)+supportAt(p,a,a.pos);
    if(j)for(const i of j.atk){const x=armyById(i);if(x&&x.owner===p)me+=power(x)}
    const def=power(t)+(G.ar.some(z=>z!==t&&z.owner===t.owner&&!z.aboard&&adjS(z.pos,t.pos))?1:0);
    const need=L===2?1.15:1.0;
    const coinOk=G.pl[p].coins>=3||me>=2*def;
    const sc=me/def+(t.owner===ME&&L===2?.2:0)+(j?.2:0)+(t.dagger?.15:0);
    if(me>=def*need&&coinOk&&sc>bsc){bsc=sc;bt=t}
  }
  if(bt)declare(a,bt);
}
function smartRansom(p,L){
  const P=G.pl[p];
  const outside=G.ar.filter(a=>a.owner===p&&!inCastle(a)&&!ownPort(a)).length;
  const reserve=L===2?outside+2:3;
  const rank=d=>d.t==='cmd'?({queen:5,general:4,king:6,captain:2}[d.k]||3):({HC:1.4,HI:1.2,LC:1.3,LI:1}[d.k]||1);
  for(let n=0;n<3&&P.coins>=3+reserve&&P.dead.length;n++){
    let bi=0;P.dead.forEach((d,i)=>{if(rank(d)>rank(P.dead[bi]))bi=i});
    if(!doRansom(p,bi))break;
  }
}
function flagTarget(p,c){
  for(let i=0;i<4;i++)if(same(FLAGP[i],c)&&G.orig[i]!==p&&alive(G.orig[i]))return true;
  return false;
}
function reachFrom(a,c){
  const sv=[a.pos,a.moved,a.def,a.noMove,a.aboard];a.pos=c.slice();a.moved=false;a.def=false;a.noMove=-1;a.aboard=null;
  let r=[];try{r=reach(a)}finally{[a.pos,a.moved,a.def,a.noMove,a.aboard]=sv}
  return r;
}
function enemyUnion(p){
  const U=new Set();
  for(const e of G.ar){
    if(e.owner===p||!alive(e.owner)||e.aboard||e.kind==='captain')continue;
    for(const c of enemyReach(e))U.add(key(c[0],c[1]));
  }
  return U;
}
// быстрая победа: клетка, с которой флаг врага берётся следующим ходом, и никто не успеет помешать
function quickWinCell(a,p,T,U){
  if(a.kind==='captain'||a.aboard)return null;
  let best=null,bd=1e9;
  for(let i=0;i<4;i++){
    const F=FLAGP[i];
    if(G.orig[i]===p||!alive(G.orig[i])||armiesAt(F[0],F[1]).length)continue;
    if(U.has(key(F[0],F[1])))continue;
    for(const c of reach(a)){
      if((T.get(key(c[0],c[1]))||0)>0)continue;
      if(!reachFrom(a,c).some(z=>same(z,F)))continue;
      // клетки пути между c и F не должны быть доступны врагу
      const dx=Math.sign(F[0]-c[0]),dy=Math.sign(F[1]-c[1]);let ok=true;
      for(let x=c[0]+dx,y=c[1]+dy;!(x===F[0]&&y===F[1]);x+=dx,y+=dy)if(U.has(key(x,y))){ok=false;break}
      if(ok&&cheb(c,F)<bd){bd=cheb(c,F);best=c}
    }
  }
  return best;
}
// угроза флагу: вражеские сухопутные армии, которые могут встать на флаг или напасть на его защитника
function flagThreats(p){
  const fl=FLAGP[p],out=[];
  for(const e of G.ar){
    if(e.owner===p||!alive(e.owner)||e.aboard||e.kind==='captain')continue;
    if(enemyReach(e).some(c=>same(c,fl))||(armiesAt(fl[0],fl[1]).length&&enemyReach(e).some(c=>adjS(c,fl)))||adjS(e.pos,fl))out.push(e);
  }
  return out;
}
function botTurnSmart(p,L){
  if(G.over||G.cur!==p||G.phase!=='move')return;
  const g=G;
  smartRansom(p,L);
  for(const a of G.ar.filter(x=>x.owner===p&&atStock(x)))refill(a);
  const fl=FLAGP[p];
  const hot=G.ar.some(e=>e.owner!==p&&alive(e.owner)&&!e.aboard&&e.kind!=='captain'&&cheb(e.pos,fl)<=(L===2?6:4));
  let list=G.ar.filter(a=>a.owner===p&&a.kind!=='king');
  // защитник флага: ближайшая к флагу сухопутная армия
  let defender=null;
  if(hot){
    const cl=list.filter(a=>a.kind!=='captain'&&!a.aboard).sort((a,b)=>cheb(a.pos,fl)-cheb(b.pos,fl));
    const onFlag=cl.find(x=>same(x.pos,fl));
    defender=onFlag||cl[0]||null;
  }
  list=L===2?list.sort((a,b)=>power(b)-power(a)):sh(list);
  let threats=L===2?flagThreats(p):[];
  if(threats.length){
    // все силы на защиту флага: ближайшие ходят первыми, армия короля тоже участвует
    list=G.ar.filter(a=>a.owner===p&&a.kind!=='captain').sort((a,b)=>cheb(a.pos,fl)-cheb(b.pos,fl));
  }
  const step=i=>{
    if(g!==G||G.over||G.cur!==p)return;
    if(i>=list.length)return endTurn(p);
    const a=list[i];
    if(!G.ar.includes(a)||a.owner!==p||a.def)return step(i+1);
    // захват флага = выбытие соперника: важнее любого боя
    if(a.kind!=='captain'){
      const fc=reach(a).find(c=>flagTarget(p,c));
      if(fc){moveArmy(a,fc);if(G.over)return draw();draw();return setTimeout(()=>step(i+1),300)}
    }
    if(L===2&&a.kind!=='captain'&&threats.length){
      threats=flagThreats(p);
      if(threats.length){
        const fo=armiesAt(fl[0],fl[1]);
        const onF=same(a.pos,fl);
        if(!onF){
          let bc=null,bv=1e9;
          const near=c=>Math.min(...threats.map(e=>cheb(e.pos,c)));
          for(const c of reach(a)){
            let v=cheb(c,fl)*2+near(c);
            if(same(c,fl))v=-100;
            else if(fo.length&&!fo.some(z=>z.owner===p))v-=0;
            if(v<bv){bv=v;bc=c}
          }
          const flagBusy=fo.some(z=>z!==a&&z.owner===p);
          if(bc&&!(same(bc,fl)&&flagBusy)){moveArmy(a,bc);if(G.over)return draw()}
        }
        if(G.ar.includes(a)){
          const tg=G.ar.filter(t=>canAttack(a,t)&&(threats.includes(t)||adjS(t.pos,fl)));
          tg.sort((x,y)=>power(y)-power(x));
          if(tg.length){
            if(a.dagger){const dg=tg.find(t=>canDagger(a,t));if(dg){useDagger(a,dg);draw();return setTimeout(()=>step(i+1),300)}}
            declare(a,tg[0]);
          }
        }
        draw();return setTimeout(()=>step(i+1),300);
      }
    }
    if(L===2&&a.kind!=='captain'&&!a.aboard){
      const Tq=threatMap(p),Uq=enemyUnion(p),qc=quickWinCell(a,p,Tq,Uq);
      if(qc){moveArmy(a,qc);draw();return setTimeout(()=>step(i+1),300)}
    }
    const T=threatMap(p);
    const bs=bastAt(a.pos[0],a.pos[1]);
    const gs=goalsW(p,L,a.kind==='captain');
    if(a.kind!=='captain')gs.push(...goalsHome(p,L,a));
    const c=smartBestCell(a,p,L,T,gs,a===defender);
    if(c&&!same(c,a.pos))moveArmy(a,c);
    if(G.over)return draw();
    if(a.kind!=='captain'&&G.ar.includes(a)&&a.units.length>=3){
      const b2=bastAt(a.pos[0],a.pos[1]);
      if(b2&&b2.gar===null&&(G.co[b2.seat]===p||b2.occ===p))garLeave(a);
      else if(L===2&&estAt(a)&&G.co[G.est[key(a.pos[0],a.pos[1])].seat]===p&&!G.orph[key(a.pos[0],a.pos[1])])estLeave(a);
    }
    smartAttack(a,p,L);
    draw();setTimeout(()=>step(i+1),300);
  };
  step(0);
}

/* ---------- бой: расстановка ---------- */
function bPlaceSmart(q){
  if(q.corner<0){const fr=sh([0,1,2,3].filter(c=>!BT.parts.some(z=>z.corner===c)));q.corner=fr[0]}
  const c=CORN[q.corner];
  const at=(i,j)=>[c[0]+(c[0]===0?i:2-i),c[1]+(c[1]===0?j:2-j)];
  const cmd=q.pieces.find(p=>p.cmd),tent=q.pieces.find(p=>p.tent);
  const units=q.pieces.filter(p=>!p.cmd&&!p.tent).sort((a,b)=>(PV[b.k]||0)-(PV[a.k]||0));
  const put=(p,xy)=>{p.x=xy[0];p.y=xy[1]};
  put(cmd,at(0,0));
  const shield=[at(1,0),at(0,1),at(1,1),at(1,2),at(2,0),at(2,1),at(2,2),at(0,2)];
  if(tent){put(tent,at(0,2));shield.splice(shield.length-1,1)}
  let sh_=shield.slice(0,3),rest=shield.slice(3);
  for(const u of units){const s=sh_.length?sh_.shift():rest.shift();if(!s)break;put(u,s)}
  for(const p of q.pieces)if(p.x===null){const free=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){const z=at(i,j);if(!bat(z[0],z[1]))free.push(z)}put(p,free[0])}
}

/* ---------- бой: поиск ---------- */
const PV={LI:100,HI:120,LC:170,HC:210,queen:0,king:0,xking:0,general:0,captain:0};
let NODES=0,NLIM=0;
function bGen(q){
  const out=[],dis=isDis(q);
  for(const p of q.pieces){
    if(!p.alive||p.tent)continue;
    for(const[x,y]of pm(p))out.push(['m',p,x,y]);
    if(canExit(p)&&(dis||!p.cmd))out.push(['x',p]);
  }
  return out;
}
function bDo(m){
  const p=m[1];
  if(m[0]==='x'){const q=BT.parts[p.pi],u={p,ex:true,cf:q.cmdFled};p.alive=false;p.fled=true;if(p.cmd)q.cmdFled=true;return u}
  const o=bat(m[2],m[3]),u={p,x:p.x,y:p.y,o};
  if(o){o.alive=false;const oq=BT.parts[o.pi];u.oq=oq;u.f=[oq.tentLost,oq.cmdDead];if(o.tent)oq.tentLost=true;else if(o.cmd)oq.cmdDead=true}
  p.x=m[2];p.y=m[3];return u;
}
function bUndo(u){
  const p=u.p;
  if(u.ex){p.alive=true;p.fled=false;if(p.cmd)BT.parts[p.pi].cmdFled=u.cf;return}
  p.x=u.x;p.y=u.y;
  if(u.o){u.o.alive=true;u.oq.tentLost=u.f[0];u.oq.cmdDead=u.f[1]}
}
function bEval(me){
  const parts=BT.parts,mine=parts.filter(z=>z.owner===me),foes=parts.filter(z=>z.owner!==me);
  const myDis=mine.every(isDis),foeDis=foes.every(isDis);
  let s=0;
  if(myDis){
    s=-6000;
    for(const q of mine)for(const p of q.pieces){
      if(p.tent||p.cmd)continue;
      const v=PV[p.k]||100;
      if(p.fled)s+=v*.9;else if(p.alive)s+=v*.5-8*edgeDist(p);
    }
    return s;
  }
  if(foeDis)s+=6000;
  const foeAim=[];
  for(const q of foes){
    if(isDis(q)){s+=1500;continue}
    for(const p of q.pieces)if(p.alive&&(p.cmd||p.tent))foeAim.push(p);
  }
  for(const q of mine){
    if(isDis(q)){s-=1500;continue}
    for(const p of q.pieces){
      if(p.fled&&!p.cmd&&!p.tent){s+=(PV[p.k]||100)*.9;continue}
      if(!p.alive||p.tent)continue;
      if(!p.cmd){
        s+=PV[p.k]||100;
        if(foeAim.length)s-=3*Math.min(...foeAim.map(e=>Math.abs(e.x-p.x)+Math.abs(e.y-p.y)));
        if(batk(p.x,p.y,me)&&!parts.some(z=>z.owner===me&&z!==q&&false))s-=35;
      }else if(batk(p.x,p.y,me))s-=2500;
    }
    const tn=q.pieces.find(z=>z.tent&&z.alive);
    if(tn&&batk(tn.x,tn.y,me))s-=2200;
  }
  for(const q of foes){
    for(const p of q.pieces){
      if(p.tent||p.cmd||(!p.alive&&!p.fled))continue;
      s-=(PV[p.k]||100)*(isDis(q)?.6:1);
    }
    if(!isDis(q)){
      for(const p of q.pieces)if(p.alive&&(p.cmd||p.tent)){
        // моя атака на полководца/шатёр врага
        const atk=BT.P.some(e=>e.alive&&e.k!=='tent'&&e.owner===me&&pm(e).some(m=>m[0]===p.x&&m[1]===p.y));
        if(atk)s+=1100;
      }
    }
  }
  return s;
}
function bAB(me,ci,d,a,b){
  if(++NODES>NLIM||d<=0)return bEval(me);
  const parts=BT.parts;
  if(parts.filter(z=>z.owner===me).every(isDis)||parts.filter(z=>z.owner!==me).every(isDis))return bEval(me);
  const q=parts[ci],nx=(ci+1)%parts.length;
  const mv=bGen(q);
  if(!mv.length)return bAB(me,nx,d-1,a,b);
  mv.sort((x,y)=>mvPri(y)-mvPri(x));
  const maxi=q.owner===me;
  let best=maxi?-1e9:1e9;
  for(const m of mv){
    const u=bDo(m),v=bAB(me,nx,d-1,a,b);bUndo(u);
    if(maxi){if(v>best)best=v;if(best>a)a=best}else{if(v<best)best=v;if(best<b)b=best}
    if(a>=b)break;
  }
  return best;
}
function mvPri(m){
  if(m[0]==='x')return 1;
  const o=bat(m[2],m[3]);
  if(!o)return 0;
  return o.tent||o.cmd?1000:(PV[o.k]||100);
}
function botMoveSmart(q,L){
  // армия осталась только с полководцем: не мучить игрока, а сдаться (убежать за край)
  if(!isDis(q)&&!(q.castle&&q.isDef)){
    const un=q.pieces.filter(p=>p.alive&&!p.tent&&!p.cmd).length;
    const foeU=BT.P.filter(p=>p.alive&&p.owner!==q.owner&&!p.tent&&!p.cmd&&!isDis(BT.parts[p.pi])).length;
    const cmd=q.pieces.find(p=>p.cmd&&p.alive);
    if(!un&&foeU>=2&&cmd){
      if(canExit(cmd))return bstep('x',cmd);
      const ms=pm(cmd).sort((a,b)=>edgeDist({x:a[0],y:a[1]})-edgeDist({x:b[0],y:b[1]}));
      if(ms.length&&edgeDist(cmd)>0)return bstep('m',cmd,ms[0][0],ms[0][1]);
    }
  }
  const mv=bGen(q);
  if(!mv.length){BT.cur=(BT.cur+1)%BT.parts.length;BT.n++;return turnLoop()}
  const np=BT.parts.length,ci=BT.cur,nx=(ci+1)%np;
  const left=BT.P.filter(p=>p.alive&&!p.tent).length;
  const maxD=L===1?3:(typeof HD!=='undefined'&&HD?HD:(left<=8?4:3));
  NLIM=L===1?12000:(typeof HN!=='undefined'&&HN?HN:45000);
  mv.sort((x,y)=>mvPri(y)-mvPri(x));
  let best=mv[0],ranked=mv.map(m=>[m,0]);
  for(let d=1;d<=maxD;d++){
    NODES=0;
    const sc=[];let ok=true;
    let alpha=-1e9;
    for(const[m]of ranked){
      const u=bDo(m);
      const v=bAB(q.owner,nx,d-1,alpha,1e9);
      bUndo(u);
      if(NODES>NLIM&&d>1){ok=false;break}
      sc.push([m,v+Math.random()*(L===1?10:2)]);
      if(v>alpha)alpha=v;
    }
    if(!ok)break;
    sc.sort((x,y)=>y[1]-x[1]);
    ranked=sc;best=sc[0][0];
  }
  bstep(best[0],best[1],best[2],best[3]);
}

<h2>Цель игры</h2><p>Остаться последним королевством. Игрок выбывает, если погиб его король или враг встал на его флаг 🚩 в углу карты. Земля, постройки и армии выбывшего достаются победителю.</p>

<h2>Нападение и бой</h2><ul><li>Чтобы напасть, встаньте рядом (по стороне) с вражеской армией и нажмите «Напасть». После нападения армия уже не ходит.</li><li>Защищающийся может откупиться: 1 монета за каждого нападающего игрока. Иначе начинается бой на поле 8×8.</li><li>В бою побеждает тот, кто убьёт полководца или захватит шатёр. Проигравший платит 3 монеты, остатки армии бегут за край поля.</li><li>В бою у края поля фигура может сбежать кнопкой «🏃 Сбежать».</li><li>Бой на флаге замка: гибель полководца или шатра сразу уничтожает армию.</li></ul>

<div style="margin-top:14px;text-align:center"><button class="on" onclick="document.getElementById('help').style.display='none'">Понятно</button></div></div>`;

window.stopTut=function(){TUT=null;try{const v=localStorage.getItem('bk_nb');NB=(v!==null&&+v>=1&&+v<=3)?+v:3;const d=localStorage.getItem('bk_diff');DIFF=(d!==null&&+d>=0&&+d<=2)?+d:1}catch(e){NB=3;DIFF=1}clearInterval(tmr);tmr=null;tmod.style.display='none';tbtn.style.display='none';tstep.style.display='none'};
window.startTut=function(){
  NB=1;DIFF=0;
  TUT={f:{},cells:[],closed:false};cur=0;steps.forEach(s=>{s.started=false;s.ack=false});
  start();
  clearInterval(tmr);tmr=setInterval(tick,300);tbtn.style.display='block';
  tick();
};

function tick(){
  if(!TUT)return;
  const s=stepOf();
  if(!s){clearInterval(tmr);tstep.style.display='none';return}
  if(BT)TUT.f.bt=1;
  if(s.miss&&!s.started&&s.miss()){cur++;TUT.skip=false;return setTimeout(tick,50)}
  const waiting=s.w&&!s.started&&!s.w();
  tstep.style.display='block';tstep.textContent='Задание '+(cur+1)+' из '+steps.length+(waiting?': ждём подходящего момента (ход соперников)…':': '+s.t);
  if(waiting)return;
  if(!s.started){
    s.started=true;if(s.on)try{s.on()}catch(e){console.error(e);TUT.skip=true}
    render(TUT.justDone);TUT.justDone=false;tmod.style.display='flex';
    if(s.k==='info')return;
  }
  const fin=s.k==='info'?s.ack:(()=>{try{return s.done()}catch(e){return true}})();
  if(fin){
    if(s.off)try{s.off()}catch(e){}
    cur++;TUT.justDone=s.k!=='info';TUT.skip=false;
    if(stepOf())setTimeout(tick,50);else{tbtn.style.display='none';tstep.style.display='none'}
  }
}

SND.coins=function(c,out,t,n){

  for(let i=0;i<n;i++){
    const tt=t+i*.075+Math.random()*.02,f=2100+Math.random()*1500;
    osc(c,out,'sine',f,f*.995,tt,.002,.16,.35);
    osc(c,out,'sine',f*2.76,f*2.74,tt,.002,.07,.18);

  }

/* боевой горн: две ноты, «медный» тембр */
SND.horn=function(c,out,t){
  const notes=[[196,0,.32],[293.7,.30,.75]];
  for(const [f,d,len] of notes){
    const tt=t+d;
    for(const det of [-4,4]){
      const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter(),lfo=c.createOscillator(),lg=c.createGain();
      o.type='sawtooth';o.frequency.value=f;o.detune.value=det;
      lfo.frequency.value=5.5;lg.gain.value=f*.006;lfo.connect(lg);lg.connect(o.frequency);
      lp.type='lowpass';lp.Q.value=2;lp.frequency.setValueAtTime(500,tt);lp.frequency.linearRampToValueAtTime(2100,tt+.12);lp.frequency.linearRampToValueAtTime(1100,tt+len);
      g.gain.setValueAtTime(0.0001,tt);g.gain.linearRampToValueAtTime(.2,tt+.06);g.gain.setValueAtTime(.2,tt+len-.12);g.gain.exponentialRampToValueAtTime(0.0001,tt+len);
      o.connect(lp);lp.connect(g);g.connect(out);o.start(tt);lfo.start(tt);o.stop(tt+len+.05);lfo.stop(tt+len+.05);
    }
  }

  nz(c,out,t+.07,.14,'lowpass',1800,260,.8,.42,.004);        // рассечение

SND.stab=function(c,out,t){

function loadSamples(){
  if(!AC||loadSamples.done)return;loadSamples.done=true;
  for(const k in SMP){try{
    const bin=atob(SMP[k][0].split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const pr=AC.decodeAudioData(u.buffer,x=>{BUF[k]=x},()=>{});if(pr&&pr.catch)pr.catch(()=>{});
  }catch(e){}}
}
function play(name,arg){
  const c=ensure();if(!c)return;
  loadSamples();
  if(BUF[name]){try{const src=c.createBufferSource(),g=c.createGain();src.buffer=BUF[name];g.gain.value=SMP[name][1];src.connect(g);g.connect(MASTER);src.start();return}catch(e){}}
  if(!SND[name])return;
  try{SND[name](c,MASTER,c.currentTime+.005,arg)}catch(e){}
}
function _oldplay(name,arg){
  const c=ensure();if(!c||!SND[name])return;
  try{SND[name](c,MASTER,c.currentTime+.005,arg)}catch(e){}
}
window.__snd={SND,play,ST};

/* --- привязка к событиям игры --- */
function wrap(nm,fn){try{const o=eval(nm);eval(nm+'=fn(o)')}catch(e){}}
wrap('pay',o=>function(from,amt,to){
  if(!G||!G.pl)return o.apply(this,arguments);const before=G.pl[from]?G.pl[from].coins:0;
  const r=o.apply(this,arguments);
  try{const got=before-(G.pl[from]?G.pl[from].coins:0);if(got>0&&to!==null&&to!==undefined)play('coins',got+1)}catch(e){}
  return r;
});
wrap('declare',o=>function(a,t){const r=o.apply(this,arguments);if(r)play('horn');return r});
wrap('useDagger',o=>function(a,t){const r=o.apply(this,arguments);if(r)play('stab');return r});
wrap('bapply',o=>function(p,x,y){const hit=!!bat(x,y);const r=o.apply(this,arguments);play(hit?'slash':'step');return r});
wrap('moveArmy',o=>function(a,to,free){const r=o.apply(this,arguments);play(a&&a.kind==='captain'&&typeof lake==='function'&&lake(to[0],to[1])?'waves':'step');return r});
wrap('startBoard',o=>function(){const r=o.apply(this,arguments);play('drum');return r});
wrap('eliminate',o=>function(pid){const al=G&&G.pl&&G.pl[pid]&&G.pl[pid].alive;const r=o.apply(this,arguments);if(al)play('gong');return r});

const set=document.createElement('div');set.id='setm';set.style.cssText='display:none;position:fixed;inset:0;z-index:1100;align-items:center;justify-content:center;background:rgba(20,12,4,.72);padding:12px';
document.body.appendChild(set);
function row(label,val,btns){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap"><div style="font-size:18px">${label}</div><div>${btns}</div></div>`}
function renderSet(){
  const th=curTheme();
  set.innerHTML=`<div class="box" style="background:var(--card);color:var(--tx);border:3px solid var(--ac);border-radius:18px;padding:22px 26px;max-width:460px;width:100%;box-shadow:0 10px 40px #000a">
  <button onclick="__setClose()" style="float:right">✕</button><h2 style="margin:0 0 6px;color:var(--ac)">⚙ Настройки</h2>
  ${row('🔊 Звук','',`<button class="${ST.sound?'on':''}" onclick="__setSound(true)">Вкл</button> <button class="${!ST.sound?'on':''}" onclick="__setSound(false)">Выкл</button>`)}
  ${row('🎨 Тема','',`<button class="${th==='light'?'on':''}" onclick="__setTheme('light')">☀ Светлая</button> <button class="${th==='dark'?'on':''}" onclick="__setTheme('dark')">🌙 Тёмная</button>`)}
  <div style="text-align:center;margin-top:10px"><button class="on" onclick="__setClose()">Готово</button></div></div>`;
}
window.openSettings=function(){renderSet();set.style.display='flex'};
window.__setClose=()=>{set.style.display='none'};
window.__setSound=v=>{ST.sound=v;save();if(v){ensure();play('horn')}renderSet()};
window.__setTheme=v=>{ST.theme=v;save();applyTheme();renderSet()};

gb.style.cssText='position:fixed;left:96px;bottom:10px;z-index:900;padding:6px 12px;font-size:15px;opacity:.85;display:none';
